name: Build Windows x64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows-x64.yml"
      - "src/**"
      - "README.md"
      - "makefile"
  pull_request:
    paths:
      - ".github/workflows/build-windows-x64.yml"
      - "src/**"
      - "README.md"
      - "makefile"

permissions:
  contents: read

env:
  # Targets IDA Professional 9.4 (9.4.260714.951e98a4)
  IDA_SDK_REF: v9.4.0-sdk.1
  ARTIFACT_NAME: fusion64-windows-x64
  OUTPUT_PATH: release\\fusion64-windows-x64.dll

jobs:
  build:
    name: Build Windows x64 DLL
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Checkout IDA SDK
        uses: actions/checkout@v4
        with:
          repository: HexRaysSA/ida-sdk
          ref: ${{ env.IDA_SDK_REF }}
          path: sdk
          fetch-depth: 1

      - name: Verify SDK layout
        shell: pwsh
        run: |
          if (-not (Test-Path "sdk/src/lib/x64_win_64/ida.lib")) {
            throw "Missing sdk/src/lib/x64_win_64/ida.lib after SDK checkout."
          }

      - name: Build plugin
        shell: cmd
        run: |
          if exist obj rmdir /s /q obj
          if exist release rmdir /s /q release
          mkdir obj
          mkdir release
          cl /nologo /EHsc /O2 /std:c++17 /utf-8 /I sdk\src\include /D__NT__ /D__EA64__ /c src\*.cpp /Foobj\ || exit /b 1
          link /NOLOGO /DLL /NOIMPLIB /OUT:%OUTPUT_PATH% obj\*.obj sdk\src\lib\x64_win_64\ida.lib user32.lib || exit /b 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_PATH }}
          if-no-files-found: error
